name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bastal
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bastal"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - run: npm run db:generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bastal?schema=public
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_WEBHOOK_SECRET: whsec_placeholder
          BOOTSTRAP_SECRET: ci-bootstrap-secret-16
          MFA_ENFORCEMENT_ENABLED: "false"
